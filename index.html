<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធ Login & Notification ជាមួយ Firebase</title>
    <!-- បញ្ចូល Font ខ្មែរ -->
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- បញ្ចូល SDK EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Kantumruy Pro', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e0eafc, #cfdef3);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: #ffffff;
            padding: 35px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 420px;
        }

        .card h2 {
            color: #1a73e8;
            font-size: 22px;
            margin-bottom: 8px;
            text-align: center;
        }

        .card p {
            color: #5f6368;
            font-size: 14px;
            margin-bottom: 20px;
            text-align: center;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            color: #202124;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #dadce0;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }

        .input-group input:focus {
            border-color: #1a73e8;
            box-shadow: 0 0 0 2px rgba(26, 115, 232, 0.2);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-login { background-color: #1a73e8; color: white; }
        .btn-login:hover { background-color: #1557b0; }

        .btn-register { background-color: #34a853; color: white; }
        .btn-register:hover { background-color: #2d9247; }

        .btn-action { background-color: #ff9800; color: white; width: 100%; margin-top: 15px; }
        .btn-action:hover { background-color: #e68a00; }

        .btn-logout { background-color: #ea4335; color: white; width: 100%; margin-top: 10px; }

        #message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
        }

        .dashboard { display: none; }
    </style>
</head>
<body>

    <div class="card">
        <!-- ផ្ទាំង Login / Register -->
        <div id="authSection">
            <h2>ចូលប្រើប្រាស់</h2>
            <p>ប្រព័ន្ធសុវត្ថិភាព Firebase Auth</p>

            <form id="authForm">
                <div class="input-group">
                    <label for="email">អ៊ីមែល (Email)</label>
                    <input type="email" id="email" placeholder="example@email.com" required>
                </div>

                <div class="input-group">
                    <label for="password">លេខសម្ងាត់ (Password)</label>
                    <input type="password" id="password" placeholder="យ៉ាងហោច ៦ ខ្ទង់" required>
                </div>

                <div class="btn-group">
                    <button type="button" id="loginBtn" class="btn-login">ចូល</button>
                    <button type="button" id="registerBtn" class="btn-register">បង្កើតគណនី</button>
                </div>
            </form>
        </div>

        <!-- ផ្ទាំង Dashboard ពេល Login រួច -->
        <div id="dashboardSection" class="dashboard">
            <h2>ស្វាគមន៍!</h2>
            <p id="userEmailDisplay"></p>
            
            <!-- ប៊ូតុងតេស្តធ្វើប្រតិបត្តិការ -->
            <button id="buyBtn" class="btn-action">💳 តេស្តទិញទំនិញ $10.00</button>
            <button id="logoutBtn" class="btn-logout">ចាកចេញ (Logout)</button>
        </div>

        <div id="message"></div>
    </div>

    <!-- ===== Firebase Modular SDK ===== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            createUserWithEmailAndPassword, 
            signInWithEmailAndPassword, 
            onAuthStateChanged, 
            signOut 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // ១. កូដ Firebase Config របស់អ្នក
        const firebaseConfig = {
            apiKey: "AIzaSyCK7w2phlBp-X6-1ycH4xvvIWuIv6FQH1A",
            authDomain: "my-first-app-babac.firebaseapp.com",
            projectId: "my-first-app-babac",
            storageBucket: "my-first-app-babac.firebasestorage.app",
            messagingSenderId: "997211161853",
            appId: "1:997211161853:web:4befac13bab828d7532a94"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // ២. កូដ EmailJS Config របស់អ្នក
        emailjs.init("_MbXXSD7ZNNTux7-t");

        // HTML Elements
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const registerBtn = document.getElementById('registerBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const buyBtn = document.getElementById('buyBtn');
        const messageDiv = document.getElementById('message');
        const authSection = document.getElementById('authSection');
        const dashboardSection = document.getElementById('dashboardSection');
        const userEmailDisplay = document.getElementById('userEmailDisplay');

        let currentUserEmail = "";

        // ៣. បង្កើតគណនី (Register)
        registerBtn.addEventListener('click', () => {
            const email = emailInput.value;
            const password = passwordInput.value;
            if(!email || !password) return showMessage("សូមបញ្ចូលអ៊ីមែល និងលេខសម្ងាត់!", "red");

            createUserWithEmailAndPassword(auth, email, password)
                .then(() => showMessage("បង្កើតគណនីជោគជ័យ!", "green"))
                .catch((err) => showMessage(getErrorMessage(err.code), "red"));
        });

        // ៤. ចូលប្រើប្រាស់ (Login)
        loginBtn.addEventListener('click', () => {
            const email = emailInput.value;
            const password = passwordInput.value;
            if(!email || !password) return showMessage("សូមបញ្ចូលអ៊ីមែល និងលេខសម្ងាត់!", "red");

            signInWithEmailAndPassword(auth, email, password)
                .then(() => showMessage("ចូលប្រើប្រាស់ជោគជ័យ!", "green"))
                .catch((err) => showMessage(getErrorMessage(err.code), "red"));
        });

        // ៥. ចាកចេញ (Logout)
        logoutBtn.addEventListener('click', () => {
            signOut(auth);
        });

        // ៦. តាមដានស្ថានភាព Login & សុំសិទ្ធិ Notification
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUserEmail = user.email;
                authSection.style.display = "none";
                dashboardSection.style.display = "block";
                userEmailDisplay.innerText = "គណនី៖ " + user.email;

                // សុំសិទ្ធិ Notification
                if (Notification.permission !== 'granted') {
                    Notification.requestPermission();
                }
            } else {
                authSection.style.display = "block";
                dashboardSection.style.display = "none";
            }
        });

        // ៧. តេស្តធ្វើប្រតិបត្តិការទិញទំនិញ (ផ្ញើ Email + Pop-up Alert)
        buyBtn.addEventListener('click', () => {
            showMessage("កំពុងដំណើរការប្រតិបត្តិការ...", "#1a73e8");

            // ក. ផ្ញើ Email Alert តាម EmailJS
            emailjs.send("service_ytb6stk", "template_puv7pxo", {
                to_email: currentUserEmail,
                message: "ប្រតិបត្តិការទិញទំនិញតម្លៃ $10.00 ទទួលបានជោគជ័យ!"
            }).then(() => {
                showMessage("ប្រតិបត្តិការជោគជ័យ! Email Alert ត្រូវ​បានផ្ញើចូលប្រអប់សំបុត្រ។", "green");
            }).catch((err) => {
                showMessage("ប្រតិបត្តិការជោគជ័យ! ប៉ុន្តែផ្ញើ Email មានបញ្ហា។", "orange");
                console.error("EmailJS Error:", err);
            });

            // ខ. បង្ហាញ Pop-up Alert លើ Screen មាន Logo
            if (Notification.permission === 'granted') {
                new Notification("ទូទាត់ជោគជ័យ! 🎉", {
                    body: "ប្រតិបត្តិការទិញទំនិញតម្លៃ $10.00 រួចរាល់។",
                    icon: "https://cdn-icons-png.flaticon.com/512/190/190411.png" // រូប Logo ខាងឆ្វេង
                });
            }
        });

        function showMessage(msg, color) {
            messageDiv.style.color = color;
            messageDiv.innerText = msg;
        }

        function getErrorMessage(code) {
            switch (code) {
                case 'auth/email-already-in-use': return 'អ៊ីមែលនេះមានគេប្រើរួចហើយ!';
                case 'auth/invalid-email': return 'ទម្រង់អ៊ីមែលមិនត្រឹមត្រូវទេ!';
                case 'auth/weak-password': return 'លេខសម្ងាត់ត្រូវមានយ៉ាងហោចណាស់ ៦ ខ្ទង់!';
                case 'auth/invalid-credential': return 'អ៊ីមែល ឬលេខសម្ងាត់មិនត្រឹមត្រូវទេ!';
                default: return 'មានបញ្ហាកើតឡើង៖ ' + code;
            }
        }
    </script>
</body>
</html>
