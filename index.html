<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធ Login & Screen Notification</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Kantumruy Pro', sans-serif; }
        body {
            background: linear-gradient(135deg, #e0eafc, #cfdef3);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 20px;
        }
        .card {
            background-color: #ffffff; padding: 35px 30px; border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1); width: 100%; max-width: 420px;
        }
        .card h2 { color: #1a73e8; font-size: 22px; margin-bottom: 8px; text-align: center; }
        .card p { color: #5f6368; font-size: 14px; margin-bottom: 20px; text-align: center; }
        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; color: #202124; margin-bottom: 6px; font-size: 14px; font-weight: 500; }
        .input-group input { width: 100%; padding: 12px 14px; border: 1px solid #dadce0; border-radius: 6px; font-size: 15px; outline: none; }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 6px; font-size: 15px; font-weight: 500; cursor: pointer; transition: 0.2s; }
        .btn-login { background-color: #1a73e8; color: white; }
        .btn-login:hover { background-color: #1557b0; }
        .btn-register { background-color: #34a853; color: white; }
        .btn-register:hover { background-color: #2d9247; }
        .btn-enable-notif { background-color: #9c27b0; color: white; width: 100%; margin-top: 15px; display: none; }
        .btn-enable-notif:hover { background-color: #7b1fa2; }
        .btn-action { background-color: #ff9800; color: white; width: 100%; margin-top: 15px; }
        .btn-action:hover { background-color: #e68a00; }
        .btn-logout { background-color: #ea4335; color: white; width: 100%; margin-top: 10px; }
        #message { margin-top: 15px; text-align: center; font-size: 14px; font-weight: 500; }
        .dashboard { display: none; }
    </style>
</head>
<body>

    <div class="card">
        <!-- ផ្ទាំង Login / Register -->
        <div id="authSection">
            <h2>ចូលប្រើប្រាស់</h2>
            <p>ប្រព័ន្ធសុវត្ថិភាព Firebase Auth</p>

            <form id="authForm">
                <div class="input-group">
                    <label for="email">អ៊ីមែល (Email)</label>
                    <input type="email" id="email" placeholder="example@email.com" required>
                </div>

                <div class="input-group">
                    <label for="password">លេខសម្ងាត់ (Password)</label>
                    <input type="password" id="password" placeholder="យ៉ាងហោច ៦ ខ្ទង់" required>
                </div>

                <div class="btn-group">
                    <button type="button" id="loginBtn" class="btn-login">ចូល</button>
                    <button type="button" id="registerBtn" class="btn-register">បង្កើតគណនី</button>
                </div>
            </form>
        </div>

        <!-- ផ្ទាំង Dashboard ពេល Login រួច -->
        <div id="dashboardSection" class="dashboard">
            <h2>ស្វាគមន៍!</h2>
            <p id="userEmailDisplay"></p>
            
            <!-- ប៊ូតុងចុចសុំសិទ្ធិ Notification -->
            <button id="enableNotifBtn" class="btn-enable-notif">🔔 ចុចទីនេះដើម្បីបើកសិទ្ធិ Notification</button>

            <!-- ប៊ូតុងតេស្តធ្វើប្រតិបត្តិការ -->
            <button id="buyBtn" class="btn-action">💳 តេស្តទិញទំនិញ $10.00</button>
            <button id="logoutBtn" class="btn-logout">ចាកចេញ (Logout)</button>
        </div>

        <div id="message"></div>
    </div>

    <!-- ផ្នែក JavaScript ស្ថិតនៅចន្លោះ <script> ខាងក្រោមនេះ -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            createUserWithEmailAndPassword, 
            signInWithEmailAndPassword, 
            onAuthStateChanged, 
            signOut 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // កូដ Firebase Config របស់អ្នក
        const firebaseConfig = {
            apiKey: "AIzaSyCK7w2phlBp-X6-1ycH4xvvIWuIv6FQH1A",
            authDomain: "my-first-app-babac.firebaseapp.com",
            projectId: "my-first-app-babac",
            storageBucket: "my-first-app-babac.firebasestorage.app",
            messagingSenderId: "997211161853",
            appId: "1:997211161853:web:4befac13bab828d7532a94"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Elements
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const registerBtn = document.getElementById('registerBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const buyBtn = document.getElementById('buyBtn');
        const enableNotifBtn = document.getElementById('enableNotifBtn');
        const messageDiv = document.getElementById('message');
        const authSection = document.getElementById('authSection');
        const dashboardSection = document.getElementById('dashboardSection');
        const userEmailDisplay = document.getElementById('userEmailDisplay');

        // បង្កើតគណនី
        registerBtn.addEventListener('click', () => {
            const email = emailInput.value;
            const password = passwordInput.value;
            if(!email || !password) return showMessage("សូមបញ្ចូលអ៊ីមែល និងលេខសម្ងាត់!", "red");

            createUserWithEmailAndPassword(auth, email, password)
                .then(() => showMessage("បង្កើតគណនីជោគជ័យ!", "green"))
                .catch((err) => showMessage(getErrorMessage(err.code), "red"));
        });

        // ចូលប្រើប្រាស់
        loginBtn.addEventListener('click', () => {
            const email = emailInput.value;
            const password = passwordInput.value;
            if(!email || !password) return showMessage("សូមបញ្ចូលអ៊ីមែល និងលេខសម្ងាត់!", "red");

            signInWithEmailAndPassword(auth, email, password)
                .then(() => showMessage("ចូលប្រើប្រាស់ជោគជ័យ!", "green"))
                .catch((err) => showMessage(getErrorMessage(err.code), "red"));
        });

        // ចាកចេញ
        logoutBtn.addEventListener('click', () => { signOut(auth); });

        // តាមដានស្ថានភាព Login & ពិនិត្យសិទ្ធិ Notification
        onAuthStateChanged(auth, (user) => {
            if (user) {
                authSection.style.display = "none";
                dashboardSection.style.display = "block";
                userEmailDisplay.innerText = "គណនី៖ " + user.email;

                checkNotificationPermission();
            } else {
                authSection.style.display = "block";
                dashboardSection.style.display = "none";
            }
        });

        // មុខងារពិនិត្យមើលសិទ្ធិ Notification
        function checkNotificationPermission() {
            if (Notification.permission !== 'granted') {
                enableNotifBtn.style.display = "block";
                showMessage("សូមចុចប៊ូតុងពណ៌ស្វាយខាងលើដើម្បីបើកសិទ្ធិ Notification!", "orange");
            } else {
                enableNotifBtn.style.display = "none";
                showMessage("ប្រព័ន្ធ Notification រួចរាល់សម្រាប់ប្រើប្រាស់!", "green");
            }
        }

        // ចុចប៊ូតុងដើម្បីឱ្យវាសួរ Allow Notification
        enableNotifBtn.addEventListener('click', () => {
            Notification.requestPermission().then((permission) => {
                if (permission === 'granted') {
                    checkNotificationPermission();
                    alert("អរគុណ! អ្នកបានបើកសិទ្ធិ Notification រួចរាល់ហើយ។");
                } else if (permission === 'denied') {
                    alert("អ្នកបានបដិសេធ (Block) Notification!");
                }
            });
        });

        // 🔔 តេស្តធ្វើប្រតិបត្តិការទិញទំនិញ -> បង្ហាញសារ Alert លើ Screen
        buyBtn.addEventListener('click', () => {
            if (Notification.permission === 'granted') {
                new Notification("ទូទាត់ជោគជ័យ! 🎉", {
                    body: "ប្រតិបត្តិការទិញទំនិញតម្លៃ $10.00 រួចរាល់។",
                    icon: "https://cdn-icons-png.flaticon.com/512/190/190411.png"
                });
                showMessage("ប្រតិបត្តិការជោគជ័យ! សារ Alert បានលោតលើ Screen។", "green");
            } else {
                showMessage("សូមចុចប៊ូតុងពណ៌ស្វាយខាងលើដើម្បីបើកសិទ្ធិជាមុនសិន!", "red");
            }
        });

        function showMessage(msg, color) {
            messageDiv.style.color = color;
            messageDiv.innerText = msg;
        }

        function getErrorMessage(code) {
            switch (code) {
                case 'auth/email-already-in-use': return 'អ៊ីមែលនេះមានគេប្រើរួចហើយ!';
                case 'auth/invalid-email': return 'ទម្រង់អ៊ីមែលមិនត្រឹមត្រូវទេ!';
                case 'auth/weak-password': return 'លេខសម្ងាត់ត្រូវមានយ៉ាងហោចណាស់ ៦ ខ្ទង់!';
                case 'auth/invalid-credential': return 'អ៊ីមែល ឬលេខសម្ងាត់មិនត្រឹមត្រូវទេ!';
                default: return 'មានបញ្ហាកើតឡើង៖ ' + code;
            }
        }
    </script>
</body>
</html>
